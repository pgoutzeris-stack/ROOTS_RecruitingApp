name: notfall page in sync

# Die Notfallseite enthaelt eine Kopie des Fragenkatalogs, weil sie ohne Netz
# funktionieren muss. Dieser Lauf schlaegt fehl, sobald der Katalog geaendert
# wurde, ohne notfall.html neu zu erzeugen - sonst fuehrt jemand im Ernstfall
# ein Gespraech nach veralteten Fragen.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "notfall.html"
      - "tools/build-notfall.mjs"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
      - run: node tools/build-notfall.mjs --check
